  <style>
    :root {
      --bg-main: #0D0B14;
      --bg-card: #161324;
      --border-subtle: #2D264B;
      --text-main: #FFFFFF;
      --text-sec: #CBD5E1;
      --purple-primary: #7B2CBF;
      --purple-vibrant: #8B5CF6;
      --blue-tech: #2563EB;
      --gold: #FBBF24;
      --brand-grad: linear-gradient(135deg, #2563EB, #9333EA);
    }
    html.light {
      --bg-main: #F8F7FC;
      --bg-card: #FFFFFF;
      --border-subtle: #CBD5E1;
      --text-main: #0F172A;
      --text-sec: #475569;
    }
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-size: 15px;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    h1, h2, h3, h4, .font-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .title-screen { font-size: 24px; font-weight: 800; line-height: 1.25; }
    .subtitle-screen { font-size: 18px; font-weight: 700; line-height: 1.35; }
    .body-text { font-size: 15px; font-weight: 400; }
    .label-text { font-size: 12px; font-weight: 500; }

    /* Brand gradient strictly for primary button, progress bar and chatbot header */
    .bg-brand-grad {
      background: linear-gradient(135deg, #2563EB, #9333EA);
    }
    .btn-primary-emco {
      background: linear-gradient(135deg, #2563EB, #9333EA);
      color: #FFFFFF;
      height: 52px;
      border-radius: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 16px rgba(123, 44, 191, 0.35);
    }
    .btn-primary-emco:hover { opacity: 0.95; transform: translateY(-1px); }
    .btn-primary-emco:active { transform: translateY(0); }

    .btn-secondary-emco {
      border: 1.5px solid var(--border-subtle);
      background: transparent;
      color: #8B5CF6;
      min-height: 44px;
      border-radius: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .btn-secondary-emco:hover {
      border-color: #8B5CF6;
      background: rgba(139, 92, 246, 0.08);
    }

    .emco-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      transition: border-color 0.2s ease, background-color 0.25s ease;
    }
    .emco-input {
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-main);
      padding: 14px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s ease;
      min-height: 48px;
    }
    .emco-input:focus {
      border-color: #8B5CF6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }
    .emco-chip {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .emco-chip.active {
      background-color: #7B2CBF;
      border-color: #8B5CF6;
      color: #FFFFFF;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2D264B; border-radius: 9999px; }

    /* Typing animation 3 dots */
    @keyframes bounceDot {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    .typing-dot {
      width: 7px; height: 7px; background-color: #8B5CF6; border-radius: 50%; display: inline-block;
      animation: bounceDot 1.3s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 0.9; }
      100% { opacity: 0.5; }
    }
    .skeleton-emco {
      background-color: #161324;
      animation: shimmer 1.5s infinite ease-in-out;
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

        </div>
      </div>

      <!-- Selector Rápido de Módulos -->

        <button onclick="switchGlobalMode('onboarding')" id="mode-btn-onboarding" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[#2D264B] bg-[#161324] hover:border-[#8B5CF6] transition flex items-center gap-1.5 whitespace-nowrap">

        <button onclick="switchGlobalMode('emprendedor')" id="mode-btn-emprendedor" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[#8B5CF6] bg-[#7B2CBF] text-white transition flex items-center gap-1.5 whitespace-nowrap">

    /********************************************************************
     * 3. UTILIDADES VISUALES Y COMPONENTES COMUNES
     ********************************************************************/
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const borderColor = type === 'error' ? 'border-[#EF4444]' : type === 'gold' ? 'border-[#FBBF24]' : 'border-[#22C55E]';
      const iconClass = type === 'error' ? 'ph-warning-circle text-[#EF4444]' : type === 'gold' ? 'ph-sparkle text-[#FBBF24]' : 'ph-check-circle text-[#22C55E]';
      toast.className = `pointer-events-auto emco-card border-l-4 ${borderColor} p-3.5 shadow-2xl flex items-center gap-3 text-xs font-medium text-white bg-[#161324] transition-all duration-300`;
      toast.innerHTML = `
        <i class="ph-fill ${iconClass} text-lg shrink-0"></i>
        <div class="flex-1">${message}</div>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 250);
      }, 3400);
    }

    function openModal(title, htmlContent) {
      document.getElementById('modal-title').innerHTML = title;
      document.getElementById('modal-body').innerHTML = htmlContent;
      document.getElementById('universal-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('universal-modal').classList.add('hidden');
    }

    function getLogoHTML(sizeClass = 'w-12 h-12', textSize = 'text-xl') {
      return `
        <div class="inline-flex items-center justify-center">
          <img src="logo-emco.png" alt="Logo EMCO" class="${sizeClass} rounded-2xl object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
          <div style="display:none;" class="${sizeClass} rounded-2xl bg-brand-grad items-center justify-center font-heading font-extrabold text-white ${textSize} shadow-lg">
            E
          </div>
        </div>
      `;
    }

    function getMarketBadge(comp) {
      if (comp === 'bajo') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#22C55E]/15 text-[#22C55E] border border-[#22C55E]/30"><i class="ph-bold ph-trend-down"></i> Por debajo del promedio</span>`;
      } else if (comp === 'encima') {
        return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-[#FBBF24]/15 text-[#FBBF24] border border-[#FBBF24]/30"><i class="ph-bold ph-trend-up"></i> Por encima del promedio</span>`;
      }
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold bg-slate-500/20 text-[#CBD5E1] border border-slate-500/30">Precio promedio de mercado</span>`;
    }

    function getProviderById(id) {
      return DB.proveedores.find(p => p.id === id);
    }

    function getProductById(id) {
      return DB.productos.find(p => p.id === id);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('theme-icon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        html.classList.add('light');
        icon.className = 'ph-bold ph-sun';
        showToast('Modo claro activado (#F8F7FC)', 'gold');
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        icon.className = 'ph-bold ph-moon';
        showToast('Modo oscuro EMCO activado (#0D0B14)', 'gold');
      }
    }

    function toggleViewportFrame() {
      STATE.isFullWebViewport = !STATE.isFullWebViewport;
      const shell = document.getElementById('app-shell');
      const label = document.getElementById('viewport-label');
      const icon = document.getElementById('viewport-icon');
      if (STATE.isFullWebViewport) {
        shell.classList.remove('max-w-[440px]', 'sm:max-h-[880px]');
        shell.classList.add('max-w-6xl');
        label.textContent = 'Vista Web Amplia';
        icon.className = 'ph-bold ph-desktop';
      } else {
        shell.classList.add('max-w-[440px]', 'sm:max-h-[880px]');
        shell.classList.remove('max-w-6xl');
        label.textContent = 'Vista Móvil';
        icon.className = 'ph-bold ph-device-mobile';
      }
    }

    /********************************************************************
     * 4. CAMBIO DE MODO GLOBAL Y BARRA INFERIOR
     ********************************************************************/
    function switchGlobalMode(mode) {
      STATE.globalMode = mode;
      ['onboarding', 'emprendedor', 'proveedor', 'admin'].forEach(m => {
        const btn = document.getElementById(`mode-btn-${m}`);
        if (m === mode) {
          btn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-bold border border-[#8B5CF6] bg-[#7B2CBF] text-white transition flex items-center gap-1.5 whitespace-nowrap';
        } else {
          btn.className = 'px-2.5 py-1.5 rounded-lg text-xs font-medium border border-[#2D264B] bg-[#161324] hover:border-[#8B5CF6] text-[#CBD5E1] transition flex items-center gap-1.5 whitespace-nowrap';
        }
      });

      const rolePill = document.getElementById('active-role-pill');
      if (mode === 'onboarding') {
        rolePill.textContent = 'Registro / Inicio';
        STATE.onboardingStep = 'splash';
      } else if (mode === 'emprendedor') {
        rolePill.textContent = 'Rol: Emprendedor';
      } else if (mode === 'proveedor') {
        rolePill.textContent = 'Rol: Proveedor';
      } else {
        rolePill.textContent = 'Admin & Especificación';
      }

      renderApp();
    }

    function renderBottomNav() {
      const nav = document.getElementById('bottom-nav');
      if (STATE.globalMode === 'onboarding' || STATE.globalMode === 'admin') {
        nav.classList.add('hidden');
        return;
      }
      nav.classList.remove('hidden');

      if (STATE.globalMode === 'emprendedor') {
        const unreadCount = DB.conversaciones.reduce((acc, c) => acc + c.no_leidos, 0);
        const tabs = [
          { id: 'inicio', label: 'Inicio', icon: 'ph-house' },
          { id: 'mensajes', label: 'Mensajes', icon: 'ph-chat-circle-dots', badge: unreadCount },
          { id: 'ia', label: 'Asistente IA', icon: 'ph-sparkle', centerHighlight: true },
          { id: 'pedidos', label: 'Pedidos', icon: 'ph-receipt' },
          { id: 'perfil', label: 'Perfil', icon: 'ph-user-circle' }
        ];
        nav.innerHTML = tabs.map(t => {
          const isActive = STATE.empTab === t.id;
          if (t.centerHighlight) {
            return `
              <button onclick="setEmpTab('${t.id}')" class="flex flex-col items-center justify-center -mt-5 group focus:outline-none">
                <div class="w-13 h-13 p-3.5 rounded-full bg-brand-grad text-white shadow-lg shadow-[#7B2CBF]/50 border-2 ${isActive ? 'border-[#FBBF24]' : 'border-[#161324]'} flex items-center justify-center transition transform group-hover:scale-105">
                  <i class="ph-fill ${t.icon} text-xl"></i>
                </div>
                <span class="text-[11px] font-bold mt-1 ${isActive ? 'text-[#8B5CF6]' : 'text-[#CBD5E1]'}">${t.label}</span>
              </button>
            `;
          }
          return `
            <button onclick="setEmpTab('${t.id}')" class="relative flex flex-col items-center justify-center py-1 px-2 min-w-[56px] min-h-[44px] focus:outline-none">
              ${t.badge ? `<span class="absolute top-0.5 right-3 w-4 h-4 rounded-full bg-[#8B5CF6] text-white text-[10px] font-bold flex items-center justify-center">${t.badge}</span>` : ''}
              <i class="${isActive ? 'ph-fill text-[#8B5CF6]' : 'ph-bold text-[#CBD5E1]'} ${t.icon} text-xl"></i>
              <span class="text-[11px] mt-0.5 font-medium ${isActive ? 'text-[#8B5CF6] font-bold' : 'text-[#CBD5E1]'}">${t.label}</span>
              ${isActive ? `<span class="w-1.5 h-1.5 rounded-full bg-[#8B5CF6] mt-0.5"></span>` : ''}
            </button>
          `;
        }).join('');

    function updatePwdStrength(val) {
      const lbl = document.getElementById('pwd-strength-label');
      if (!lbl) return;
      if (val.length < 8) {
        lbl.textContent = 'Débil (mín. 8)';
        lbl.className = 'text-[11px] font-bold text-[#EF4444]';
      } else {
        lbl.textContent = 'Fuerte';
        lbl.className = 'text-[11px] font-bold text-[#22C55E]';
      }
    }

    /********************************************************************
     * 6. PANTALLAS DEL EMPRENDEDOR (SECCIÓN 5, 6 Y 7)
     ********************************************************************/

      const t = STATE.empTab;
      if (t === 'inicio') return renderEmpInicio();
      if (t === 'ia') return renderEmpAsistenteIA();
      if (t === 'mensajes') return renderEmpMensajes();
      if (t === 'pedidos') return renderEmpPedidos();
      if (t === 'perfil') return renderEmpPerfil();
    }

    // 5.1 INICIO + 5.2 RESULTADOS Y COMPARADOR
    function renderEmpInicio() {
      const unreadNotifs = DB.notificaciones.filter(n => n.rol === 'emprendedor' && !n.leida).length;
      const cartCount = DB.carrito.reduce((acc, item) => acc + item.cantidad, 0);

      // Filtrar productos (solo de proveedores aprobados según Regla 6.4 y 11)
      let filteredProds = DB.productos.filter(p => {
        const prov = getProviderById(p.proveedor_id);
        if (!prov || prov.estado_verificacion !== 'Verificado') return false;
        if (STATE.selectedCategory !== 'Todas' && p.categoria !== STATE.selectedCategory) return false;
        if (STATE.onlyVerifiedFilter && !prov.verificado) return false;
        if (STATE.onlyDeliveryFilter && !prov.entrega_domicilio) return false;
        if (STATE.searchQuery.trim() !== '') {
          const q = STATE.searchQuery.toLowerCase();
          return p.nombre.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q) || prov.nombre_comercial.toLowerCase().includes(q);
        }
        return true;
      });

      if (STATE.sortBy === 'precio') filteredProds.sort((a, b) => a.precio - b.precio);
      if (STATE.sortBy === 'calificacion') filteredProds.sort((a, b) => getProviderById(b.proveedor_id).calificacion - getProviderById(a.proveedor_id).calificacion);
      if (STATE.sortBy === 'cercania') filteredProds.sort((a, b) => getProviderById(a.proveedor_id).distancia_km - getProviderById(b.proveedor_id).distancia_km);

      return `

              <h1 class="title-screen">Hola, ${DB.currentUser.nombre.split(' ')[0]} 👋</h1>

            <div class="flex items-center gap-2">

              <button onclick="openCartModal()" class="relative w-11 h-11 rounded-full bg-[#7B2CBF] text-white flex items-center justify-center shadow" title="Ver Carrito y Pedido">

                ${cartCount > 0 ? `<span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#FBBF24] text-black text-[10px] font-extrabold flex items-center justify-center">${cartCount}</span>` : ''}

                <i class="ph-bold ph-microphone"></i>
              </button>
              <button onclick="simulatePhotoSearch()" class="w-8 h-8 rounded-lg bg-[#0D0B14] border border-[#2D264B] flex items-center justify-center text-[#3B82F6] hover:bg-[#2563EB] hover:text-white" title="Buscar por foto">
                <i class="ph-bold ph-camera"></i>
              </button>
            </div>
          </div>

          <!-- Tarjeta destacada con degradado: ¿Qué necesitas hoy? Pregúntale a la IA -->

              <span class="inline-flex items-center gap-1 text-[11px] font-bold uppercase tracking-wider bg-black/25 px-2.5 py-0.5 rounded-full">
                <i class="ph-fill ph-sparkle text-[#FBBF24]"></i> Asistente EMCO con IA
              </span>
              <h2 class="subtitle-screen text-white">¿Qué necesitas hoy? Pregúntale a la IA</h2>

              <i class="ph-fill ph-robot"></i>
            </div>
          </div>

          <!-- Categorías en chips horizontales -->
          <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
            ${DB.categorias.map(cat => `
              <button onclick="STATE.selectedCategory='${cat.id}'; renderApp();" class="emco-chip ${STATE.selectedCategory === cat.id ? 'active' : ''}">
                <i class="ph-bold ${cat.icono}"></i> ${cat.nombre}
              </button>

          </div>

          <!-- Proveedores destacados y Cerca de ti (Carrusel) -->

            <div class="flex items-center justify-between mb-2.5">
              <h3 class="subtitle-screen">Proveedores verificados cerca de ti</h3>
              <span class="label-text text-[#8B5CF6]">San Salvador</span>

            <div class="flex gap-3 overflow-x-auto pb-2">
              ${DB.proveedores.filter(p => p.verificado).map(prov => `
                <div onclick="openProviderProfileModal('${prov.id}')" class="emco-card p-3.5 min-w-[235px] cursor-pointer hover:border-[#8B5CF6] transition shrink-0">
                  <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-full flex items-center justify-center font-heading font-extrabold text-white text-sm shrink-0" style="background:${prov.logo_bg}">

                    <span class="text-[#CBD5E1] flex items-center gap-1"><i class="ph-bold ph-navigation-arrow text-[#8B5CF6]"></i> ${prov.distancia_km} km</span>

                <option value="cercania" ${STATE.sortBy === 'cercania' ? 'selected' : ''}>Ordenar: Más cercanos</option>
              </select>
            </div>

            <div class="flex items-center gap-2 overflow-x-auto pb-1">
              <button onclick="STATE.onlyDeliveryFilter = !STATE.onlyDeliveryFilter; renderApp();" class="emco-chip text-xs ${STATE.onlyDeliveryFilter ? 'active' : ''}">
                <i class="ph-bold ph-truck"></i> Con entrega a domicilio
              </button>
              <button onclick="openComparatorModal()" class="emco-chip text-xs border-[#8B5CF6] text-[#8B5CF6]">
                <i class="ph-bold ph-scales"></i> Comparar (${STATE.compareList.length}/3)

            <!-- Lista de Productos -->
            <div class="space-y-3">
              ${filteredProds.length === 0 ? `
                <div class="emco-card p-8 text-center space-y-3">
                  <div class="w-14 h-14 rounded-full bg-[#7B2CBF]/20 text-[#8B5CF6] mx-auto flex items-center justify-center text-2xl">

                  <p class="text-xs text-[#CBD5E1]">Intenta limpiar la búsqueda o pregúntale directamente al Asistente EMCO.</p>
                  <button onclick="STATE.searchQuery=''; STATE.selectedCategory='Todas'; renderApp();" class="btn-secondary-emco px-4 py-2 text-xs">
                    Ver todos los insumos
                  </button>
                </div>
              ` : filteredProds.map(prod => {
                const prov = getProviderById(prod.proveedor_id);
                const inCompare = STATE.compareList.includes(prod.id);
                const stockStatus = prod.stock_actual === 0 ? { text: 'Agotado', cls: 'text-[#EF4444]' } :
                                    prod.stock_actual <= prod.stock_minimo ? { text: 'Pocas unidades', cls: 'text-[#FBBF24]' } :
                                    { text: 'Disponible', cls: 'text-[#22C55E]' };
                return `

                            <span class="text-[11px] text-[#CBD5E1]">Mayorista (${prod.desde_cantidad_mayor}+):</span>
                            <span class="font-heading font-extrabold text-sm text-[#FBBF24]">$${prod.precio_mayor.toFixed(2)}</span>

                              <i class="ph-bold ph-scales"></i> ${inCompare ? 'Comparando' : 'Comparar'}

                            <button onclick="addToCart('${prod.id}', ${prod.minimo_compra})" class="px-3 py-1.5 rounded-lg bg-brand-grad text-white text-xs font-bold shadow">
                              + Pedido
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

          <div class="emco-card p-4 space-y-3">
            <div class="flex items-center justify-between">
              <h3 class="font-heading font-bold text-sm">Compras recientes · Volver a pedir</h3>
              <button onclick="openListsAndFavoritesModal()" class="text-xs font-bold text-[#8B5CF6] hover:underline">Ver mis listas</button>

            <div class="flex items-center justify-between p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B]">

          </div>

    function handleAISubmit() {

      if (!input || !input.value.trim()) return;
      sendAIMessage(input.value.trim());
      input.value = '';
    }

    function sendAIMessage(queryText) {
      DB.aiMensajes.push({ rol: 'user', texto: queryText });
      renderApp();

      const typing = document.getElementById('ai-typing-indicator');
      if (typing) typing.classList.remove('hidden');

      setTimeout(() => {
        const q = queryText.toLowerCase();
        let replyText = '';
        let matchedIds = [];

        if (q.includes('harina') || q.includes('pupusa') || q.includes('maíz')) {
          replyText = 'Encontré **Molinos y Harinas Cuscatlán** (Verificado ★ 4.9, a 2.4 km en Soyapango). Su fardo de 40 lb está a **$16.25 por mayor** (por debajo del promedio del mercado de $18.75). ¿Para qué zona de San Salvador necesitas la entrega?';
          matchedIds = ['prod-1', 'prod-4'];
        } else if (q.includes('tela') || q.includes('uniforme') || q.includes('ropa')) {
          replyText = 'Para 20 uniformes te recomiendo **Textiles San Jacinto** (Verificado ★ 4.7, a 3.1 km). Tienen rollos de 25 yardas de tela Piqué a **$63.50 por mayor** con entrega en 24-48 horas.';
          matchedIds = ['prod-5'];
        } else if (q.includes('empaque') || q.includes('postre') || q.includes('caja')) {
          replyText = 'Aquí tienes las opciones verificadas de **EcoEmpaques SV** (★ 4.8, Col. Médica a 1.8 km). Cuentan con cajas kraft con ventana y envases térmicos biodegradables en stock inmediato.';
          matchedIds = ['prod-3', 'prod-4'];
        } else if (q.includes('aceite') || q.includes('barato') || q.includes('compara')) {
          replyText = 'Comparé los precios actuales en San Salvador: el Bidón de Aceite Vegetal 20L en **Molinos y Harinas Cuscatlán** cuesta **$27.90 al por mayor** (ahorras $3.10 frente al promedio de mercado de $31.00).';
          matchedIds = ['prod-2', 'prod-1'];
        } else {
          replyText = 'Aquí tienes los proveedores verificados mejor calificados en San Salvador con stock disponible hoy. Si me indicas la **cantidad aproximada** o tu **presupuesto**, puedo filtrarte el mejor precio mayorista:';
          matchedIds = ['prod-1', 'prod-3', 'prod-5'];
        }

        DB.aiMensajes.push({
          rol: 'assistant',
          texto: replyText,
          resultados: matchedIds
        });
        renderApp();
        const scrollEl = document.getElementById('ai-chat-scroll');
        if (scrollEl) scrollEl.scrollTop = scrollEl.scrollHeight;
      }, 650);
    }

    function sendChatMessage(senderRole, quickText = null) {
      const inputId = senderRole === 'emprendedor' ? 'emp-chat-input' : 'prov-chat-input';
      const input = document.getElementById(inputId);
      const text = quickText || (input ? input.value.trim() : '');
      if (!text) return;

      const conv = DB.conversaciones.find(c => c.id === STATE.activeChatId) || DB.conversaciones[0];
      conv.mensajes.push({
        id: 'm-' + Date.now(),
        emisor: senderRole,
        tipo: 'texto',
        texto: text,
        hora: 'Ahora',
        leido: true
      });
      if (input) input.value = '';
      renderApp();
    }

    function sendChatAttachment(senderRole, labelText) {
      sendChatMessage(senderRole, labelText);
      showToast('Adjunto enviado en la conversación');
    }

    function acceptQuoteInChat(convId, msgId) {
      const conv = DB.conversaciones.find(c => c.id === convId);
      const msg = conv.mensajes.find(m => m.id === msgId);
      if (!msg || !msg.cotizacion) return;
      msg.cotizacion.aceptada = true;

      const newOrderId = 'EMC-' + Math.floor(1050 + Math.random() * 900);
      DB.pedidos.unshift({
        id: newOrderId,
        emprendedor_nombre: DB.currentUser.nombre + ' (' + DB.currentUser.negocio + ')',
        proveedor_id: conv.proveedor_id,
        estado: 'Aceptado',
        fecha: 'Ahora mismo (Desde Cotización)',
        items: msg.cotizacion.items,
        subtotal: msg.cotizacion.total - msg.cotizacion.envio,
        envio: msg.cotizacion.envio,
        total: msg.cotizacion.total,
        direccion_entrega: DB.currentUser.direcciones[0].detalle,
        nota: 'Generado automáticamente al aceptar Cotización #' + msg.cotizacion.id,
        calificado: false
      });

      showToast(`¡Cotización aceptada! Se creó el pedido #${newOrderId}`);
      renderApp();
    }

    // 5.2 COMPARADOR INTERACTIVO DE HASTA 3 PRODUCTOS
    function toggleCompareProduct(prodId) {
      const idx = STATE.compareList.indexOf(prodId);
      if (idx >= 0) {
        STATE.compareList.splice(idx, 1);
      } else {
        if (STATE.compareList.length >= 3) {
          showToast('Puedes comparar hasta un máximo de 3 productos a la vez', 'gold');
          return;
        }
        STATE.compareList.push(prodId);
      }
      updateCompareFloatingBar();
      renderApp();
    }

    function clearCompare() {
      STATE.compareList = [];
      updateCompareFloatingBar();
      renderApp();
    }

    function updateCompareFloatingBar() {
      const bar = document.getElementById('compare-floating-bar');
      const badge = document.getElementById('compare-count-badge');
      const preview = document.getElementById('compare-names-preview');
      if (STATE.compareList.length === 0 || STATE.globalMode !== 'emprendedor') {
        bar.classList.add('hidden');
        return;
      }
      bar.classList.remove('hidden');
      badge.textContent = STATE.compareList.length;
      preview.textContent = STATE.compareList.map(id => getProductById(id)?.nombre.slice(0, 18) + '...').join(' vs ');
    }

    function openComparatorModal() {
      const ids = STATE.compareList.length > 0 ? STATE.compareList : ['prod-1', 'prod-3', 'prod-5'];

              </thead>
              <tbody class="divide-y divide-[#2D264B]">
                <tr>
                  <td class="py-2.5 pr-2 text-[#CBD5E1]">Proveedor</td>
                  ${prods.map(p => {
                    const pv = getProviderById(p.proveedor_id);

                  }).join('')}
                </tr>
                <tr>
                  <td class="py-2.5 pr-2 text-[#CBD5E1]">Precio Mayorista</td>
                  ${prods.map(p => `<td class="py-2.5 px-2 font-heading font-extrabold text-sm text-[#FBBF24]">$${p.precio_mayor.toFixed(2)}</td>`).join('')}

                  <td class="py-2.5 pr-2 text-[#CBD5E1]">Precio Mercado</td>

                  <td class="py-2.5 pr-2 text-[#CBD5E1]">Calificación</td>

                <tr>
                  <td class="py-2.5 pr-2 text-[#CBD5E1]">Entrega</td>

                <tr>
                  <td class="py-2.5 pr-2 text-[#CBD5E1]">Mín. Compra</td>

                  <td class="py-2.5 pr-2 text-[#CBD5E1]">Distancia</td>

                  ${prods.map(p => `

    // 5.5 CARRITO Y ENVÍO DE PEDIDO AGRUPADO POR PROVEEDOR
    function addToCart(prodId, qty = 1) {
      const existing = DB.carrito.find(i => i.producto_id === prodId);
      if (existing) {
        existing.cantidad += qty;
      } else {
        DB.carrito.push({ producto_id: prodId, cantidad: qty });
      }
      const prod = getProductById(prodId);
      showToast(`Agregado al pedido: ${qty}x ${prod.nombre.slice(0, 28)}...`);
      renderApp();
    }

    function openCartModal() {
      if (DB.carrito.length === 0) {
        openModal('Tu Carrito de Pedido (5.5)', `
          <div class="text-center py-6 space-y-3">
            <i class="ph-duotone ph-shopping-cart text-4xl text-[#8B5CF6]"></i>
            <p class="font-bold text-sm">Tu carrito está vacío</p>
            <p class="text-xs text-[#CBD5E1]">Agrega insumos del catálogo o desde el Asistente IA.</p>
          </div>
        `);
        return;
      }

      let subtotal = 0;
      const itemsHTML = DB.carrito.map((item, idx) => {
        const prod = getProductById(item.producto_id);
        const prov = getProviderById(prod.proveedor_id);
        const unitPrice = item.cantidad >= prod.desde_cantidad_mayor ? prod.precio_mayor : prod.precio;
        const lineTotal = unitPrice * item.cantidad;
        subtotal += lineTotal;
        return `
          <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B] flex items-center justify-between gap-2 text-xs">
            <div>
              <span class="text-[10px] font-bold text-[#8B5CF6]">${prov.nombre_comercial}</span>
              <p class="font-bold text-white">${prod.icono} ${prod.nombre}</p>
              <p class="text-[#FBBF24] font-bold">${item.cantidad} x $${unitPrice.toFixed(2)} = $${lineTotal.toFixed(2)}</p>
            </div>
            <button onclick="DB.carrito.splice(${idx},1); openCartModal(); renderApp();" class="p-2 text-[#EF4444] hover:bg-[#161324] rounded-lg">
              <i class="ph-bold ph-trash"></i>
            </button>
          </div>
        `;
      }).join('');

      const envio = 3.50;
      const total = subtotal + envio;

      openModal('Carrito y Envío de Pedido (Sección 5.5)', `
        <div class="space-y-4 text-xs">
          <p class="text-[#CBD5E1]">Productos agrupados por proveedor. Al enviar, el pedido queda en estado <strong>Enviado</strong> hasta que el proveedor lo acepte.</p>
          <div class="space-y-2">${itemsHTML}</div>

          <div>
            <label class="label-text text-[#CBD5E1] block mb-1">Dirección de entrega en San Salvador</label>
            <input id="cart-address" type="text" value="${DB.currentUser.direcciones[0].detalle}" class="emco-input py-2 text-xs min-h-0" />
          </div>

          <div>
            <label class="label-text text-[#CBD5E1] block mb-1">Nota para el proveedor</label>
            <input id="cart-note" type="text" placeholder="Ej: Entregar por la mañana, pedir factura..." class="emco-input py-2 text-xs min-h-0" />
          </div>

          <div class="p-3 rounded-xl bg-[#161324] border border-[#FBBF24]/40">
            <span class="text-[10px] font-bold uppercase text-[#FBBF24]">Método de pago (Sección 5.5 y 13)</span>
            <p class="text-white font-bold mt-0.5">Acordar pago directo con el proveedor por el chat</p>
            <p class="text-[11px] text-[#CBD5E1] mt-0.5">El método de pago integrado dentro de la app está marcado como <em>Decisión pendiente de definir por el equipo</em>.</p>
          </div>

          <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B] space-y-1">
            <div class="flex justify-between"><span>Subtotal insumos:</span><span>$${subtotal.toFixed(2)}</span></div>
            <div class="flex justify-between"><span>Envío estimado:</span><span>$${envio.toFixed(2)}</span></div>
            <div class="flex justify-between font-heading font-extrabold text-base text-[#FBBF24] pt-1 border-t border-[#2D264B]">
              <span>Total a pagar:</span><span>$${total.toFixed(2)}</span>
            </div>
          </div>

          <button onclick="submitCartOrder(${subtotal}, ${envio}, ${total})" class="btn-primary-emco w-full">
            Enviar pedido al proveedor <i class="ph-bold ph-paper-plane-tilt"></i>
          </button>
        </div>
      `);
    }

    function submitCartOrder(subtotal, envio, total) {
      const newId = 'EMC-' + Math.floor(1055 + Math.random() * 800);
      const firstProd = getProductById(DB.carrito[0].producto_id);
      const itemsFormatted = DB.carrito.map(c => {
        const p = getProductById(c.producto_id);
        return {
          producto_id: p.id,
          nombre: p.nombre,
          cantidad: c.cantidad,
          precio_unitario: c.cantidad >= p.desde_cantidad_mayor ? p.precio_mayor : p.precio
        };
      });

      DB.pedidos.unshift({
        id: newId,
        emprendedor_nombre: `${DB.currentUser.nombre} (${DB.currentUser.negocio})`,
        proveedor_id: firstProd.proveedor_id,
        estado: 'Enviado',
        fecha: 'Hace un momento',
        items: itemsFormatted,
        subtotal,
        envio,
        total,
        direccion_entrega: document.getElementById('cart-address')?.value || DB.currentUser.direcciones[0].detalle,

    function providerUpdateOrderStatus(pedidoId, nuevoEstado) {
      const ped = DB.pedidos.find(p => p.id === pedidoId);
      if (!ped) return;
      ped.estado = nuevoEstado;

      // Si se acepta el pedido, descontar stock automáticamente (Sección 8.2 y 8.4)
      if (nuevoEstado === 'Aceptado') {
        ped.items.forEach(it => {
          const prod = getProductById(it.producto_id);
          if (prod) {
            prod.stock_actual = Math.max(0, prod.stock_actual - it.cantidad);
            DB.movimientosInventario.unshift({
              id: 'mov-' + Date.now(),
              producto_id: prod.id,
              fecha: 'Ahora mismo',
              tipo: 'salida',
              cantidad: it.cantidad,
              motivo: `Venta Pedido #${ped.id}`,
              responsable: 'Descuento Automático EMCO'
            });
          }
        });
        STATE.provOrderFilter = 'En proceso';
      } else if (nuevoEstado === 'Entregado') {
        STATE.provOrderFilter = 'Completados';
      }

      DB.notificaciones.unshift({
        id: 'not-' + Date.now(),
        rol: 'emprendedor',
        titulo: `Pedido #${ped.id}: ${nuevoEstado}`,
        cuerpo: `El proveedor actualizó el estado de tu pedido a "${nuevoEstado}".`,
        hora: 'Ahora',
        leida: false
      });

      showToast(`Pedido #${ped.id} actualizado a "${nuevoEstado}". Emprendedor notificado.`);
      renderApp();
    }

      DB.movimientosInventario.unshift({

        producto_id: prodId,
        fecha: 'Ahora mismo',
        tipo: 'entrada',

        responsable: 'Proveedor'

      showToast(`Stock actualizado: +${qty} uds en ${prod.nombre.slice(0, 22)}...`);

     * 9. SECCIÓN 9, 11, 12 Y 13: PANEL ADMIN, MODELO POSTGRESQL Y DECISIONES PENDIENTES
     ********************************************************************/
    function renderAdminAndSpecs() {
      const tablasSQL = [
        'usuarios(id, rol, nombre, correo, telefono, avatar_url, creado_en)',
        'emprendedores(usuario_id, negocio, tipo_negocio, municipio, departamento, categorias_interes[])',
        'proveedores(usuario_id, nombre_comercial, tipo, documento_id, descripcion, direccion, lat, lng, zonas_entrega[], horario, estado_verificacion, calificacion_promedio)',
        'documentos_verificacion(id, proveedor_id, tipo, archivo_url, estado, nota_revision)',
        'categorias(id, nombre, icono)',
        'productos(id, proveedor_id, categoria_id, nombre, descripcion, fotos[], unidad, precio, minimo_compra, activo)',
        'precios_por_volumen(id, producto_id, desde_cantidad, precio)',
        'inventario(producto_id, stock_actual, stock_minimo)',
        'movimientos_inventario(id, producto_id, tipo[entrada|salida], cantidad, motivo, pedido_id, creado_en)',
        'pedidos(id, emprendedor_id, proveedor_id, estado, subtotal, envio, total, direccion_entrega, nota, creado_en)',
        'pedido_items(id, pedido_id, producto_id, cantidad, precio_unitario)',
        'conversaciones(id, emprendedor_id, proveedor_id, ultimo_mensaje_en)',
        'mensajes(id, conversacion_id, emisor_id, tipo, contenido, adjunto_url, leido_en, creado_en)',
        'cotizaciones(id, conversacion_id, items_json, vigencia, estado)',
        'resenas(id, pedido_id, emprendedor_id, proveedor_id, estrellas, calidad, puntualidad, trato, precio, comentario, respuesta)',
        'favoritos(usuario_id, tipo, referencia_id) & listas_compra / lista_items',
        'suscripciones(id, proveedor_id, plan, monto, estado, proximo_cobro) & pagos_suscripcion',
        'comisiones(id, pedido_id, porcentaje, monto)',
        'conversaciones_ia / mensajes_ia(id, conversacion_ia_id, rol, contenido, resultados_json, feedback)',
        'reportes(id, reportante_id, objetivo_tipo, objetivo_id, motivo, estado)',
        'notificaciones(id, usuario_id, tipo, titulo, cuerpo, leida, creado_en)'
      ];

      return `
        <div class="p-4 space-y-5">
          <div>
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[#3B82F6]/20 text-[#3B82F6]">Secciones 9, 11, 12 y 13</span>
            <h1 class="title-screen mt-1">Panel Admin · Datos y Pendientes</h1>
            <p class="text-xs text-[#CBD5E1]">Aprobación de proveedores, métricas oficiales de El Salvador y configuración de decisiones pendientes.</p>
          </div>

          <!-- 12. Datos de referencia del proyecto -->
          <div class="emco-card p-4 space-y-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-[#FBBF24]">12. Datos de referencia oficiales (El Salvador)</h3>
            <div class="grid grid-cols-2 gap-2.5 text-xs">
              <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <span class="font-heading font-extrabold text-lg text-[#FBBF24]">85,000</span>
                <p class="text-[#CBD5E1] text-[11px]">MYPE activas en El Salvador (+41.7% en 2 años · 42.9% del PIB)</p>
              </div>
              <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <span class="font-heading font-extrabold text-lg text-[#FBBF24]">30 MYPE</span>
                <p class="text-[#CBD5E1] text-[11px]">Emprendedores consultados para validación en San Salvador</p>
              </div>
              <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <span class="font-heading font-extrabold text-lg text-[#FBBF24]">$2.85/mes</span>
                <p class="text-[#CBD5E1] text-[11px]">Suscripción del proveedor (margen de $1.14 / 40%)</p>
              </div>
              <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <span class="font-heading font-extrabold text-lg text-[#FBBF24]">$1,189 / $81.50</span>
                <p class="text-[#CBD5E1] text-[11px]">Capital inicial ($1,189) y Costos fijos mensuales ($81.50)</p>
              </div>
            </div>
          </div>

          <!-- 9. Aprobación de proveedores en revisión -->
          <div class="emco-card p-4 space-y-3">
            <h3 class="text-xs font-bold uppercase tracking-wider text-[#8B5CF6]">9. Aprobación de Proveedores y Moderación</h3>
            ${DB.proveedores.map((p, idx) => `
              <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B] flex items-center justify-between gap-2 text-xs">
                <div>
                  <p class="font-bold text-white">${p.nombre_comercial} <span class="text-[10px] text-[#CBD5E1]">(${p.documento_id})</span></p>
                  <p class="text-[11px] ${p.verificado ? 'text-[#22C55E]' : 'text-[#FBBF24]'}">Estado: ${p.estado_verificacion} · Reportes: ${p.reportes}/3</p>
                </div>
                <button onclick="DB.proveedores[${idx}].verificado = !DB.proveedores[${idx}].verificado; DB.proveedores[${idx}].estado_verificacion = DB.proveedores[${idx}].verificado ? 'Verificado' : 'En revisión'; showToast('Estado de verificación actualizado'); renderApp();" class="px-3 py-1.5 rounded-lg font-bold ${p.verificado ? 'bg-[#161324] border border-[#2D264B] text-[#CBD5E1]' : 'bg-[#22C55E] text-black'}">
                  ${p.verificado ? 'Revocar' : 'Aprobar Insignia'}
                </button>
              </div>
            `).join('')}
          </div>

          <!-- 13. DECISIONES PENDIENTES (CONFIGURABLES, SIN INVENTAR VALORES) -->
          <div class="emco-card p-4 space-y-3 border-2 border-[#FBBF24]/60">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#FBBF24]">13. Decisiones Pendientes (Configurables)</h3>
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-[#FBBF24]/20 text-[#FBBF24] font-bold">Regla: No inventar</span>
            </div>
            <p class="text-xs text-[#CBD5E1]">Estos 6 puntos quedan marcados explícitamente como <strong>PENDIENTE</strong> y configurables por el equipo:</p>

            <div class="space-y-2.5 text-xs">
              <div class="p-2.5 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <label class="font-bold text-[#FBBF24] block">1. Porcentaje de comisión por venta:</label>
                <input type="text" value="${DB.configPendiente.comisionPorcentaje}" onchange="DB.configPendiente.comisionPorcentaje=this.value; showToast('Configuración actualizada')" class="emco-input py-1.5 text-xs mt-1 min-h-0" />
              </div>
              <div class="p-2.5 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <label class="font-bold text-[#FBBF24] block">2. Criterios y documentos exactos de verificación:</label>
                <input type="text" value="${DB.configPendiente.criteriosVerificacion}" onchange="DB.configPendiente.criteriosVerificacion=this.value" class="emco-input py-1.5 text-xs mt-1 min-h-0" />
              </div>
              <div class="p-2.5 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <label class="font-bold text-[#FBBF24] block">3. Plan de pago opcional para emprendedor (funciones y precio):</label>
                <input type="text" value="${DB.configPendiente.planEmprendedor}" onchange="DB.configPendiente.planEmprendedor=this.value" class="emco-input py-1.5 text-xs mt-1 min-h-0" />
              </div>
              <div class="p-2.5 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <label class="font-bold text-[#FBBF24] block">4. Método de pago dentro de la app y proveedor:</label>
                <input type="text" value="${DB.configPendiente.metodoPagoApp}" onchange="DB.configPendiente.metodoPagoApp=this.value" class="emco-input py-1.5 text-xs mt-1 min-h-0" />
              </div>
              <div class="p-2.5 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <label class="font-bold text-[#FBBF24] block">5. Punto de equilibrio vigente a confirmar:</label>
                <input type="text" value="${DB.configPendiente.puntoEquilibrio}" onchange="DB.configPendiente.puntoEquilibrio=this.value" class="emco-input py-1.5 text-xs mt-1 min-h-0" />
              </div>
              <div class="p-2.5 rounded-xl bg-[#0D0B14] border border-[#2D264B]">
                <label class="font-bold text-[#FBBF24] block">6. Frecuencia de cobro de la suscripción:</label>
                <input type="text" value="${DB.configPendiente.frecuenciaCobroSuscripcion}" onchange="DB.configPendiente.frecuenciaCobroSuscripcion=this.value" class="emco-input py-1.5 text-xs mt-1 min-h-0" />
              </div>
            </div>
          </div>

          <!-- 11. Modelo de datos PostgreSQL + RLS -->
          <div class="emco-card p-4 space-y-2.5">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-bold uppercase tracking-wider text-[#3B82F6]">11. Esquema PostgreSQL / Supabase (RLS Activo)</h3>
              <span class="text-[10px] text-[#22C55E] font-bold">Row Level Security</span>
            </div>
            <div class="p-3 rounded-xl bg-[#0D0B14] border border-[#2D264B] font-mono text-[11px] text-[#CBD5E1] space-y-1 max-h-48 overflow-y-auto">
              ${tablasSQL.map(t => `<div>• ${t}</div>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /********************************************************************
     * 10. RENDERIZADO PRINCIPAL DE LA APP
     ********************************************************************/
    function renderApp() {
      const container = document.getElementById('screen-container');
      renderBottomNav();
      updateCompareFloatingBar();

      if (STATE.globalMode === 'onboarding') {
        container.innerHTML = renderOnboardingScreens();
      } else if (STATE.globalMode === 'emprendedor') {
        container.innerHTML = renderEmprendedorScreens();
      } else if (STATE.globalMode === 'proveedor') {
        container.innerHTML = renderProveedorScreens();
      } else if (STATE.globalMode === 'admin') {
        container.innerHTML = renderAdminAndSpecs();
      }
    }

    window.onload = function () {
      renderApp();
    };
  </script>
</body>
</html>
